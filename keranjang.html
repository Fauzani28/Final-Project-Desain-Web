<script>
    // --- LOGIKA KURSOR KUSTOM ---
    const cur = document.getElementById('cur');
    document.addEventListener('mousemove', e => { 
        cur.style.left = e.clientX+'px'; 
        cur.style.top = e.clientY+'px'; 
    });
    document.querySelectorAll('a, button, .cart-btn-qty').forEach(el => {
        el.addEventListener('mouseenter', () => cur.classList.add('big'));
        el.addEventListener('mouseleave', () => cur.classList.remove('big'));
    });
    
    window.addEventListener('scroll', () => document.getElementById('nav').classList.toggle('sc', scrollY > 30));

    // --- DATABASE HARGA PRODUK (Sesuai katalog) ---
    const productPrices = {
        'Kemeja Organisasi': 145000,
        'Kaos Polo': 85000,
        'Jaket / Sweater': 150000,
        'Tumblr UV Print': 55000,
        'BAG AESTHETIC': 18000,
        'Jersey Bola': 70000,
        'Baju Olahraga': 68000,
        'Kemeja Bordir': 115000,
        'Kaos Lengan Panjang': 45000,
        'Kaos Lengan Pendek': 35000,
        'Tote Bag Aesthetic': 55000,
        'Tas Custom Aesthetic': 55000,
        'Tas Costum Aesthetic': 55000,
        'Mug Eksklusif': 65000
    };

    // --- LOGIKA KERANJANG ---
    const cartItemsList = document.getElementById('cartItemsList');
    const cartTotalContainer = document.getElementById('cartTotalContainer');
    const cartTotalPrice = document.getElementById('cartTotalPrice');
    const checkoutBtn = document.getElementById('checkoutBtn');
    
    let cart = JSON.parse(localStorage.getItem('dembos_cart')) || [];

    function renderCart() {
        cartItemsList.innerHTML = '';
        
        if (cart.length === 0) {
            cartItemsList.innerHTML = '<p class="cart-empty">Keranjangmu masih kosong. Yuk pilih produk dulu!</p>';
            cartTotalContainer.style.display = 'none';
            checkoutBtn.style.opacity = '0.5';
            checkoutBtn.style.pointerEvents = 'none';
            return;
        }

        cartTotalContainer.style.display = 'block';
        checkoutBtn.style.opacity = '1';
        checkoutBtn.style.pointerEvents = 'auto';

        let grandTotal = 0;

        cart.forEach((item, index) => {
            const price = productPrices[item.name] || 0;
            const itemTotal = price * item.qty;
            grandTotal += itemTotal;

            const div = document.createElement('div');
            div.className = 'cart-item-card';
            div.innerHTML = `
                <div>
                    <div class="cart-item-name">${item.name}</div>
                    <div class="cart-item-price-info">
                        Rp ${price.toLocaleString('id-ID')} x ${item.qty}
                    </div>
                </div>
                <div class="cart-controls">
                    <span class="cart-item-subtotal">
                        Rp ${itemTotal.toLocaleString('id-ID')}
                    </span>
                    <button class="cart-btn-qty" onclick="changeQty(${index}, -1)">-</button>
                    <span class="cart-qty-text">${item.qty}</span>
                    <button class="cart-btn-qty" onclick="changeQty(${index}, 1)">+</button>
                </div>
            `;
            cartItemsList.appendChild(div);
        });

        // Set Angka Grand Total Akhir
        cartTotalPrice.innerText = 'Rp ' + grandTotal.toLocaleString('id-ID');

        // Re-attach kursor efek untuk tombol baru yang dibuat dinamik
        document.querySelectorAll('.cart-btn-qty').forEach(el => {
            el.addEventListener('mouseenter', () => cur.classList.add('big'));
            el.addEventListener('mouseleave', () => cur.classList.remove('big'));
        });
    }

    window.changeQty = function(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        localStorage.setItem('dembos_cart', JSON.stringify(cart));
        renderCart();
    };

    checkoutBtn.addEventListener('click', () => {
        let waText = "Halo Dembos! Saya ingin order produk berikut:\n\n";
        let grandTotal = 0;

        cart.forEach((item, index) => {
            const price = productPrices[item.name] || 0;
            const subtotal = price * item.qty;
            grandTotal += subtotal;
            waText += `${index + 1}. ${item.name}\n   Jumlah: ${item.qty} pcs x Rp ${price.toLocaleString('id-ID')} = Rp ${subtotal.toLocaleString('id-ID')}\n`;
        });
        
        waText += `\n=========================\n`;
        waText += `TOTAL HARGA: Rp ${grandTotal.toLocaleString('id-ID')}\n`;
        waText += `=========================\n\n`;
        waText += "Mohon info untuk instruksi pengerjaan desain & pembayarannya ya kak.";
        
        const waUrl = `https://wa.me/6285117128067?text=${encodeURIComponent(waText)}`;
        window.open(waUrl, '_blank');
    });

    renderCart();
</script>
</body>
